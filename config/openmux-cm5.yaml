# openmux-cm5.yaml - OpenMux target image for the Raspberry Pi Compute
# Module 5 (BCM2712).
#
# Build with:  ./build.sh --buildspec <customer-build-spec.yaml>
#
# The built-in "user1" account is fully driven by the customer build spec at
# build time (./build.sh emits IGconf_device_user1* / IGconf_ssh_* overrides
# from it): name, password or hash, sudo mode, uid/gid, groups and the
# multi-line authorized_keys. Nothing is hardcoded here; the account name
# "openmux" is reserved for a future OpenMux system account.
#
# The `layer:` map selects ONE layer per key (keys are free labels, no list
# support). This image's own keys are packages/extend; base + serial are
# inherited from openmux-base.yaml. The build resolves the union and completes
# the dependency graph; hook execution order follows the resolved build plan
# (deps + provides), not the key order here. openmux-packages installs the
# local .debs (its apt deps come from Debian main, so it needs no custom
# repo). The materialized buildspec hooks (user account + post_install) run
# AFTER every layer hook.
#
# openmux-repo and openmux-app are currently NOT selected - the custom APT
# repo is not finished. See the `layer:` section below to re-enable them.

include:
  file: openmux-base.yaml

# Section order matters: device: before image: (see openmux-base.yaml).
device:
  # Device layer NAME is "rpi-cm5" (generator: device/cm5/device.yaml), not
  # "cm5" (that is the directory, not the layer). `class` is the layer's
  # validation key (valid: cm5).
  layer: rpi-cm5
  class: cm5
  vendor: openmux
  hostname: openmux

image:
  # Built-in genimage layout for Raspberry Pi: VFAT boot + ext4 root.
  layer: image-rpios
  # 200% lets genimage size the boot (FAT) partition up (firmware is ~90 MiB).
  boot_part_size: 200%
  # 300% caps the root partition at 3 GiB - plenty for minbase + openmux
  # packages. Raise this if the image set grows.
  root_part_size: 300%
  name: openmux-cm5

layer:
  # openmux-repo (the custom APT repo) is not complete yet, so it is left out:
  # a layer is selected by giving it a key, and dropping the key disables it.
  # NOTE: openmux-app declares `X-Env-Layer-Requires: openmux-repo`, so it must
  # stay out too - selecting it would force the repo back into the plan. To
  # re-enable the custom repo + its package list (and the curl/git distro
  # packages openmux-app adds), restore both keys:
  #   repo: openmux-repo
  #   app: openmux-app
  # repo: openmux-repo
  packages: openmux-packages
  # app: openmux-app
  # Target only (not the medium): the medium installs the target from a
  # fixed-size USB stick, so extend-filesystem is not needed there.
  extend: openmux-extend-filesystem
