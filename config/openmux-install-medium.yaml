# openmux-install-medium.yaml - the USB install medium (factory boot menu).
#
# Build with:  ./build.sh  (no business build spec needed - the medium is a
#                          fixed factory appliance: root + blank password +
#                          the 8-option menu + the prebuilt target image
#                          embedded in it + a root filesystem that is READ-ONLY
#                          by default, so nothing a session writes on the stick
#                          survives a reboot)
#
# The `layer:` map selects ONE layer per key (free labels, no list support);
# base + serial are inherited from openmux-base.yaml, `medium` is this image's
# own key. The medium does NOT use the customer APT repo (target-side only).
# openmux-install-medium does: root account tweaks, getty/autologin drop-ins,
# defensive first-boot unit masking, install of the local .debs (hardware,
# factory-tools, install-menu) + overlayroot, embedding of the target image,
# and - through
# openmux-install-medium.d/for/linux-base/cmdline.d/30-openmux-overlay - the
# `overlayroot=tmpfs` kernel parameter that makes the stick's root read-only by
# default (menu option 8 clears it again). The layer header explains why that
# setting is contributed as a cmdline fragment, why `ro` must never accompany
# it, and why the layer additionally ships an initramfs-tools hook: this minbase
# initrd has no grep (so overlayroot cannot find its overlay driver) and its
# mount is klibc's, which cannot do the `mount --move` overlayroot needs -
# without those two the stick boots read-write and says almost nothing.
#
# The device's user1 slot is filled by an INERT account (name "user1", no
# password -> locked): the factory login is root (blank password and
# autologin, configured by the openmux-install-medium layer and overlay). The
# built-in account hooks only need a consistent value for the slot to exist.

include:
  file: openmux-base.yaml

# Section order matters: device: before image: (see openmux-base.yaml).
device:
  layer: rpi-cm5
  class: cm5
  vendor: openmux
  hostname: openmux-install-medium
  # Inert user1 (see the note above): no password + no ssh key = a locked
  # account that simply exists.
  user1: user1

image:
  # Same layout as the target (the embedded target image goes into /opt,
  # i.e. the ext4 root, so the same 3 GiB cap applies).
  layer: image-rpios
  boot_part_size: 200%
  root_part_size: 300%
  name: openmux-install-medium-cm5
  # MANDATORY for this image: it boots from a USB stick.
  # The default (by-slot) puts root=/dev/disk/by-slot/system on the kernel
  # cmdline, but those symlinks can never exist on a USB-booted system: they
  # are created by image-rpios's 99-rpi-05-image.rules for partitions the
  # rpi-storage-binder tags RPI_ONBOOTDEV=1, and the tagger
  # (/usr/bin/rpi-bootdev-tag) only maps the firmware boot-mode to a block
  # device for SD/eMMC (1 -> mmcblk0) and NVMe (6 -> nvme0n1) - and the rule
  # itself only matches mmcblk0p*/nvme0n1p*/dm-*, never the sdX a USB stick
  # gets. The initramfs therefore waits, gives up and panics:
  #   ALERT!  /dev/disk/by-slot/system does not exist.  Dropping to a shell!
  # (this was invisible for as long as early boot went to HDMI - see the
  # openmux-serial-console layer).
  # partuuid makes the same layout emit root=PARTUUID=<disk-signature>-02 on
  # the cmdline and matching PARTUUID entries in /etc/fstab - resolved by
  # initramfs/udev, drive-name independent, so the stick stays flashable to any
  # USB device. Only allowed because the medium's partition map is 'clear'
  # (no LUKS: a dm root would have no PARTUUID of its own).
  devid_scheme: partuuid

layer:
  medium: openmux-install-medium
