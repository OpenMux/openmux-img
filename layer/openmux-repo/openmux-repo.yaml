# METABEGIN
# X-Env-Layer-Name: openmux-repo
# X-Env-Layer-Category: openmux
# X-Env-Layer-Desc: Configure the OpenMux custom APT repository (DEB822 or
# X-Env-Layer-Desc: one-line format), install its GPG key when shipped, then
# X-Env-Layer-Desc: refresh package lists and full-upgrade inside the chroot.
# X-Env-Layer-Version: 1.0.2
# X-Env-Layer-Requires:
# X-Env-Layer-Provides: openmux-repo
# X-Env-VarPrefix: om
#
# X-Env-Var-repo_uri:
# X-Env-Var-repo_uri-Desc: APT base URI substituted into the repo definition.
# X-Env-Var-repo_uri-Desc: When empty, the hook falls back to its placeholder.
# X-Env-Var-repo_uri-Required: n
# X-Env-Var-repo_uri-Valid: regex:^https?://
# X-Env-Var-repo_uri-Set: n
# METAEND
---
# No YAML mapping - the layer's work is done by a per-layer RUNNER step hook:
#   hooks/customize10-repo   (flat hooks/<phase>NN-* layout; the runner
#   scans hooks/<phase>* directly and does not traverse subdirectories)
# which runs in the customize phase at this layer's plan position (before
# openmux-app), with LAYER_DIR set by the runner. An earlier version used an
# inline `mmdebstrap: customize-hooks:` entry that referenced `$LAYER_DIR`;
# that broke because inline bdebstrap hooks do NOT receive the layer's
# environment (only the runner's per-layer hooks do, see bin/runner
# layer_vars). See the hook file's header for the details.
# (No YAML mapping required - the engine tolerates a pure-comment body,
# mmdebstrap_layer_paths returns nothing for it, and the runner still
# executes the layer's hooks/ tree.)
