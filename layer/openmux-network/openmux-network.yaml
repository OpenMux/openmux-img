# Standard distro package, from the base mirrors: a layer's mmdebstrap packages
# install at the essential phase, before any custom repository is configured.
mmdebstrap:
  packages:
    - wireguard-tools

# Two cleanup hooks (openmux-network.d/hooks/):
# cleanup10-network-stack writes the state, cleanup20-netplan-render runs
# netplan-generator and judges what it produced. Same phase, name order.
#
# Phase, not Requires, is what makes this layer's edits final. runner feeds
# every plan layer into a single bdebstrap run, whose phases are strictly
# setup -> packages -> customize -> cleanup, each phase visiting plan layers in
# plan order. So a cleanup hook runs after every layer's customize hook no
# matter where this layer lands in the plan: the deletion of rpi-device-base's
# generated .network files cannot be undone by that layer being planned later
# (a customize hook would need a Requires: rpi-device-base edge for that, and
# even then a later layer could re-create them), and this hook is the last writer
# of unit state before the filesystem is captured.
#
# Two of the steps are guarded, because an unguarded failure here removes the
# image's networking without saying so:
#   * the network-manager layer enables the unit through $BDEBSTRAP_HOOKS/
#     enable-units, which prints "Unit ... not found. Skipping" and exits 0 when
#     the unit is absent - so the hook checks that NetworkManager is wanted and
#     that the networkd units exist before writing any of this layer's state, and
#     fails the build rather than shipping an image where no daemon manages a
#     link;
#   * wifi.backend=iwd is checked for the same reason: with neither iwd nor
#     wpa_supplicant in the image, WPA has no backend at all, and an image that
#     cannot associate a WPA network is only detectable by booting it.
#
# Which NetworkManager this is: rpi-debian-trixie is in the base, and the
# Raspberry Pi suite's network-manager has the higher version, so the image gets
# 1.52.1-1+rpt4 rather than Debian's 1.52.1-1. That build adds a hard
# `Depends: netplan.io`, which is where netplan.io, libnetplan1,
# python3-netplan/-yaml, iproute2 and ethtool come from. netplan is therefore in
# the image whatever the config interface is, so using it as that interface costs
# nothing to maintain: a wired configuration is one YAML file plus `netplan
# apply`, instead of a device-specific nmcli invocation whose result lives in a
# file no one looks at. What keeps netplan from being a second network manager is
# that it is a renderer selector, not a daemon: it writes files - a .network for
# networkd, an .nmconnection for NetworkManager - and the daemon the renderer key
# names does the addressing.
#
# Two checks, because the failure mode is a config that means something different
# from what it says. cleanup20-netplan-render runs the generator in boot mode at
# build time, the only way to know how several files merge into one document and
# what the merged document turns into - among other things that netplan exits 0
# after discarding a file it cannot parse, so an empty log is part of the verdict.
# om-verify.sh then pins the shipped file and the state of the networkd units on
# the finished image.
#
# Deliberately NOT done here:
#   * `wifis:` or `modems:` in the shipped netplan. Both render through
#     NetworkManager; a netplan Wi-Fi configuration means a shipped credential and
#     a modem entry needs a daemon (modemmanager) that no shipped hardware requires
#     yet. The route is documented in cleanup10-network-stack rather than left
#     half-configured here.
#   * masking systemd-networkd-wait-online.service. The generator pulls it into
#     network-online.target.wants per boot, in /run, so masking it would only make
#     the config's own verdict unreadable, and the drop-in netplan writes limits it
#     to end0. Nothing in the image Wants= network-online.target.
#   * masking iwd.service: iwd is the Wi-Fi backend, it has to run.
#   * touching /etc/iwd/main.conf. EnableNetworkConfiguration=false is a conffile
#     of the Debian iwd package and is what NetworkManager wants: iwd answers
#     802.11, the manager owns addressing.
