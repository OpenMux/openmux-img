# METABEGIN
# X-Env-Layer-Name: openmux-serial-console
# X-Env-Layer-Category: openmux
# X-Env-Layer-Desc: Serial console on /dev/ttyAMA0 (BCM2712 PL011 / uart0,
# X-Env-Layer-Desc: the port behind console=serial0) for the CM5. This port is
# X-Env-Layer-Desc: the device's only debug channel (no debug UART on the CM5
# X-Env-Layer-Desc: pin header), so it carries maximum information: firmware
# X-Env-Layer-Desc: boot log, the full kernel console and the login prompt.
# X-Env-Layer-Desc: Decomposition: (1) firmware console routing -> the lines
# X-Env-Layer-Desc: in openmux-config.txt appended to config.txt (uart0 is
# X-Env-Layer-Desc: the 40-pin PL011; BCM2712 would otherwise default the
# X-Env-Layer-Desc: console to a debug uart such as ttyAMA10, unavailable on
# X-Env-Layer-Desc: CM5);
# X-Env-Layer-Desc: (2) full kernel console -> a cmdline.d fragment strips
# X-Env-Layer-Desc: every console token other layers contribute and adds the
# X-Env-Layer-Desc: single console=serial0,115200, which is therefore also
# X-Env-Layer-Desc: /dev/console - the only device the initramfs and PID 1
# X-Env-Layer-Desc: write to. Fragments are applied in PLAN order, so this
# X-Env-Layer-Desc: layer must be planned after the family-base defaults for
# X-Env-Layer-Desc: the strip to work (see the Requires below); console=tty1 is
# X-Env-Layer-Desc: deliberately NOT added;
# X-Env-Layer-Desc: (3) login prompt -> systemd's getty-generator provides
# X-Env-Layer-Desc: serial-getty@ttyAMA0: it walks every active kernel console
# X-Env-Layer-Desc: and adds a serial getty for each non-VC one, so the login
# X-Env-Layer-Desc: prompt does not depend on the console= order - no unit
# X-Env-Layer-Desc: creation or enabling here.
# X-Env-Layer-Desc: earlycon is deliberately NOT used: the full UART driver
# X-Env-Layer-Desc: covers all practical debug and enable_uart=1 covers the
# X-Env-Layer-Desc: pre-driver (firmware) window.
# X-Env-Layer-Version: 3.1.0
# X-Env-Layer-Requires: rpi-boot-firmware,rpi-device-base
# X-Env-Layer-Provides: openmux-serial
#
# METAEND
---
# The kernel cmdline is assembled at the PREIMAGE stage from every plan
# layer's for/linux-base/cmdline.d fragments (plan order, then file name),
# NOT from any file in the chroot - a customize-hook editing
# $1/boot/firmware/cmdline.txt can never work: at customize time that file
# is still the stock template, and the assembly runs later and overwrites
# it. This layer ships exactly one fragment (engine convention - same
# layout as the engine's own family-base layer, whose 00-defaults
# fragment lives in family-base.d/for/linux-base/cmdline.d/; the scan is
# <layer-name>.d/for/linux-base/cmdline.d/, NOT the layer root):
#   openmux-serial-console.d/for/linux-base/cmdline.d/10-openmux-serial:
#     -console=* +console=serial0,115200
# (a fragment must be exactly ONE line).
# `-console=*` is meant to strip EVERY console token another layer contributes
# - the engine's family-base (layer name rpi-device-base) 00-defaults fragment
# is
#   console=serial0,115200 console=tty1 root=ROOTDEV fsck.repair=yes rootwait
# - and replace them with the one serial console.
#
# PLAN ORDER IS THE WHOLE POINT, NOT THE CONTENTS OF THE FRAGMENT.
# foreach_dropin() walks the layers IN PLAN ORDER (then file name), so which
# fragment wins is decided by where the provider sits in layer.plan, not by the
# file name or by what it removes. rpi-device-base pulls in rpi-boot-firmware
# etc., which is why it lands AFTER a layer that only requires
# rpi-boot-firmware - and a removal that runs before the tokens exist removes
# nothing: the assembler appends family-base's console=tty1 afterwards (its
# console=serial0,115200 was silently dropped as an exact duplicate, which is
# precisely what made this look like "our fragment is being read": the serial
# half appeared to work). Confirmed by the trace of work/bootstrap/layer.plan:
#   openmux-serial-console 10-openmux-serial =>  console=serial0,115200
#   rpi-device-base        00-defaults       =>  console=serial0,115200 console=tty1 root=ROOTDEV fsck.repair=yes rootwait
#   image-rpios            50-root           =>  console=serial0,115200 console=tty1 fsck.repair=yes rootwait root=/dev/disk/by-slot/system
# i.e. the shipped cmdline.txt was, and still is, the engine default with tty1
# LAST (= /dev/console) - two earlier commits in this layer re-ordered /
# removed console=tty1 inside this fragment and were complete no-ops.
# `X-Env-Layer-Requires: rpi-device-base` (meta above) is therefore load
#-bearing: it schedules this layer after the family defaults, so `-console=*`
# really does remove them. Nothing else in the layer needs that layer, so the
# dependency is purely an ordering constraint - keep it if you ever move this
# fragment to another layer, or the console silently reverts.
#
# Re-verify without building: regenerate the plan with 'ig pipeline --plan-out'
# from the config env ('ig config --write-to'), then apply every plan layer's
# <stem>.d/for/linux-base/cmdline.d and <workdir>/for/linux-base/cmdline.d in
# plan order. The result must contain exactly one console= token.
#
# WHY THERE IS NO console=tty1 (THE HDMI/VT CONSOLE). The kernel registers a
# console for every console= token and printk copies to all of them, but the
# LAST token is the one that becomes /dev/console - and userspace never writes
# to "all consoles": the initramfs /init and PID 1 write to /dev/console only.
# Shipping "serial0 then tty1" therefore meant the initramfs messages, the
# systemd status lines and a "Kernel panic" banner all went to the framebuffer
# instead of the UART. Seen on hardware as: kernel log fine on serial, then the
# output jumps to HDMI exactly when the initrd starts - that is also when
# vc4-kms-v3d first brings up a visible framebuffer, which is what made the
# switch noticeable (and is very likely why an earlier revision of this layer
# dropped console=tty1 in the first place).
# A second copy of the boot log on a monitor buys nothing on an appliance whose
# only debug channel is the UART, so tty1 is simply not contributed here - and
# with no VT console token in play the failure mode cannot come back through a
# later layer either.
#
# The UART routing lines live in config-append.txt (next to this file) and
# are appended to the chroot's /boot/firmware/config.txt by the late hook
# openmux-serial-console.d/hooks/late/preimage20-config.txt. The hook (not an
# inline mmdebstrap: customize-hook) is what makes this work - inline hooks
# do not receive the layer environment ($LAYER_DIR expands to EMPTY there,
# which is why an earlier inline hook died with
# "cat: /openmux-config.txt: No such file or directory"); only the runner's
# per-layer hooks get LAYER_DIR/LAYER_NAME/... . A late hook for the phase
# runs after every layer's step hooks/overlays for that phase, so the append
# lands after the rpi-boot-firmware template install; genimage then carries
# the chroot's /boot/firmware/* into the boot vfat. The requires in the meta
# block (rpi-boot-firmware for the template, rpi-device-base for cmdline plan
# order) additionally order this layer after both in the plan.
#
# There is deliberately NO getty unit: the console= entry makes systemd's
# getty-generator bring up serial-getty@ttyAMA0 (a hand-enabled getty would
# double-instance agetty on the same tty). If serial login is missing on
# real hardware that is a bug to investigate, not to paper over.
# Side effect of dropping console=tty1: getty-generator only walks the ACTIVE
# kernel consoles, so no getty@tty1 is generated either - HDMI stays dark after
# the boot log instead of showing an unattended login prompt, which is the
# intent for a headless appliance. The install medium is the exception and is
# self-sufficient: the openmux-install-medium layer enables getty@tty1.service
# with its own wants-symlink, so its autologin menu still appears on a
# monitor.
# Inline mmdebstrap hooks MUST sit under the `mmdebstrap:` key (see every
# engine layer, e.g. rpi-boot-firmware) - a top-level customize-hooks: in
# the layer body is silently ignored by the parser. The layer itself carries
# no hooks: all of its work is done by the fragment above, the late preimage
# hook, and config-append.txt.
# (No YAML mapping required - the engine tolerates a pure-comment body.)
